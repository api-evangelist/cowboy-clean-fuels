aid: cowboy-clean-fuels
name: Cowboy Clean Fuels
description: 'Cowboy Clean Fuels (CCF) is a Denver, Colorado climate-technology company, founded in
  2020 and operating in Gillette, Wyoming, that produces carbon-negative renewable natural gas (RNG)
  while permanently sequestering atmospheric carbon dioxide. CCF injects non-food-grade organic
  biomass — residue products of sugar-beet refining such as molasses — into depleted coal bed methane
  (CBM) wells in the Powder River Basin, where naturally occurring methanogenic microorganisms convert
  the feedstock into methane and carbon dioxide; the coal seam then selectively adsorbs and permanently
  stores the CO2. Its lead development is the Triangle Unit Renewable Energy and Carbon Capture and
  Storage Project (TRECCS) near Gillette, Wyoming, and in May 2025 it signed an offtake agreement with
  Mercuria for RNG produced under its BiCRS+RNG methodology. Cowboy Clean Fuels is an energy and
  carbon-dioxide-removal operator, not a software vendor: it sells molecules and carbon removal
  credits, and publishes no developer program, public API, SDK or machine-readable specification.'
